<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Vendas 2026 - Alexya Kids</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDKs (Versão Compatível) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen pb-20 text-slate-800">

  <!-- Modal Customizado de Alerta -->
  <div id="customModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full mx-4 text-center">
      <h3 class="text-lg font-black text-slate-800 mb-2" id="modalTitle">Aviso</h3>
      <p class="text-sm text-slate-600 mb-6" id="modalMessage">Mensagem do sistema</p>
      <button onclick="closeModal()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl transition">Entendi</button>
    </div>
  </div>

  <!-- Cabeçalho -->
  <header class="bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-900 shadow-lg text-white sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 h-20 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-md">
          <i data-lucide="store" class="w-7 h-7 text-blue-300"></i>
        </div>
        <div>
          <h1 class="font-black text-xl tracking-tight leading-none">Alexya Kids</h1>
          <p class="text-xs text-blue-200 mt-1 font-medium">Controle de Vendas • 2026</p>
        </div>
      </div>
      
      <!-- Seleção de Mês/Ano -->
      <div class="flex items-center gap-2 bg-white/10 p-1.5 rounded-xl backdrop-blur-md">
        <i data-lucide="calendar" class="w-4 h-4 text-blue-300 ml-2"></i>
        <select id="monthSelect" onchange="loadData()" class="bg-transparent text-sm font-semibold focus:outline-none cursor-pointer pr-2 text-white">
          <option value="0" class="text-slate-800">Janeiro</option>
          <option value="1" class="text-slate-800">Fevereiro</option>
          <option value="2" class="text-slate-800">Março</option>
          <option value="3" class="text-slate-800">Abril</option>
          <option value="4" class="text-slate-800">Maio</option>
          <option value="5" class="text-slate-800">Junho</option>
          <option value="6" class="text-slate-800">Julho</option>
          <option value="7" class="text-slate-800">Agosto</option>
          <option value="8" class="text-slate-800">Setembro</option>
          <option value="9" class="text-slate-800">Outubro</option>
          <option value="10" class="text-slate-800">Novembro</option>
          <option value="11" class="text-slate-800">Dezembro</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main id="mainContent" class="max-w-6xl mx-auto px-4 mt-6 fade-in">
    
    <!-- Cards de Resumo (Hoje e Mês) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      
      <!-- Vendas de Hoje -->
      <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between border-l-4 border-l-emerald-500">
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Vendas de Hoje</p>
          <h3 id="totalToday" class="text-3xl font-black text-emerald-600 mt-1">R$ 0,00</h3>
        </div>
        <div class="bg-emerald-50 p-4 rounded-2xl">
          <i data-lucide="sun" class="w-8 h-8 text-emerald-600"></i>
        </div>
      </div>

      <!-- Total do Mês -->
      <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Total do Mês Selecionado</p>
          <h3 id="totalIncomes" class="text-3xl font-black text-blue-600 mt-1">R$ 0,00</h3>
        </div>
        <div class="bg-blue-50 p-4 rounded-2xl">
          <i data-lucide="trending-up" class="w-8 h-8 text-blue-600"></i>
        </div>
      </div>

      <!-- Total de Vendas (Quantidade) -->
      <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Qtd. Vendas no Mês</p>
          <h3 id="totalCount" class="text-3xl font-black text-slate-700 mt-1">0</h3>
        </div>
        <div class="bg-slate-100 p-4 rounded-2xl">
          <i data-lucide="shopping-bag" class="w-8 h-8 text-slate-600"></i>
        </div>
      </div>
    </div>

    <!-- Formulário e Lista de Vendas -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Formulário -->
      <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm h-fit">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-blue-600"></i> Nova Venda / Entrada
        </h2>
        <form id="financeForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Descrição do Item / Venda</label>
            <input type="text" id="desc" required placeholder="Ex: Venda p/ vizinha / Vestido" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Valor (R$)</label>
            <input type="number" step="0.01" id="amount" required placeholder="0,00" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-md shadow-blue-500/20">
            <i data-lucide="check" class="w-4 h-4"></i> Salvar Venda
          </button>
        </form>
      </div>

      <!-- Tabela de Lançamentos -->
      <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
          <i data-lucide="list" class="w-5 h-5 text-blue-600"></i> Vendas Registradas no Mês
        </h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase">
                <th class="py-3 px-2">Data / Hora</th>
                <th class="py-3 px-2">Descrição</th>
                <th class="py-3 px-2">Valor</th>
                <th class="py-3 px-2 text-right">Ação</th>
              </tr>
            </thead>
            <tbody id="transactionsList" class="text-sm divide-y divide-slate-50">
              <!-- Registros inseridos via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script>
    // 1. Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCR3k3_5gjIfDeZqORC8Dhz4q01sGWsio8",
      authDomain: "financeiro-alexya-kids-2026.firebaseapp.com",
      projectId: "financeiro-alexya-kids-2026",
      storageBucket: "financeiro-alexya-kids-2026.firebasestorage.app",
      messagingSenderId: "223204491487",
      appId: "1:223204491487:web:b06093954d2bc47dc1a96a"
    };

    // Inicialização do Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Selecionar mês atual por padrão
    document.getElementById('monthSelect').value = new Date().getMonth();

    // Carregar ícones do Lucide
    lucide.createIcons();

    // Função para exibir modal de aviso
    function showModal(title, msg) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMessage').innerText = msg;
      const modal = document.getElementById('customModal');
      modal.classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeModal() {
      const modal = document.getElementById('customModal');
      modal.classList.add('opacity-0', 'pointer-events-none');
    }

    // Guardar novo registro com data exata
    async function handleFormSubmit(e) {
      e.preventDefault();
      const desc = document.getElementById('desc').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const month = parseInt(document.getElementById('monthSelect').value);
      const now = new Date();

      try {
        await db.collection("transactions").add({
          description: desc,
          amount: amount,
          type: "income",
          month: month,
          year: 2026,
          createdAt: firebase.firestore.Timestamp.fromDate(now)
        });

        document.getElementById('financeForm').reset();
        showModal("Sucesso!", "Venda registrada com sucesso.");
        loadData();
      } catch (err) {
        showModal("Erro", "Erro ao salvar no banco de dados: " + err.message);
      }
    }

    // Carregar registros do banco e calcular total diário e mensal
    async function loadData() {
      const selectedMonth = parseInt(document.getElementById('monthSelect').value);
      const tbody = document.getElementById('transactionsList');
      tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-slate-400">Carregando dados...</td></tr>';

      try {
        const snapshot = await db.collection("transactions")
          .where("month", "==", selectedMonth)
          .where("year", "==", 2026)
          .get();

        let totalIncomes = 0;
        let totalToday = 0;
        let count = 0;
        tbody.innerHTML = '';

        const hojeStr = new Date().toDateString();

        if (snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-slate-400">Nenhuma venda registrada neste mês.</td></tr>';
        } else {
          // Ordenar por data (mais recente primeiro)
          const docs = [];
          snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
          
          docs.sort((a, b) => {
            const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
            const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
            return dateB - dateA;
          });

          docs.forEach(item => {
            totalIncomes += item.amount;
            count++;

            // Verificar se a venda foi feita hoje
            const itemDate = item.createdAt?.toDate ? item.createdAt.toDate() : null;
            if (itemDate && itemDate.toDateString() === hojeStr) {
              totalToday += item.amount;
            }

            // Formatar data para exibição na tabela
            const dataFormatada = itemDate ? itemDate.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';

            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50/50 transition";
            tr.innerHTML = `
              <td class="py-3 px-2 text-xs text-slate-500 font-medium">${dataFormatada}</td>
              <td class="py-3 px-2 font-medium text-slate-700">${item.description}</td>
              <td class="py-3 px-2 font-bold text-emerald-600">
                R$ ${item.amount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
              </td>
              <td class="py-3 px-2 text-right">
                <button onclick="deleteTransaction('${id}')" class="p-1.5 text-slate-400 hover:text-rose-600 transition" title="Apagar venda">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }

        // Atualizar Resumos nos Cards
        document.getElementById('totalToday').innerText = `R$ ${totalToday.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
        document.getElementById('totalIncomes').innerText = `R$ ${totalIncomes.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
        document.getElementById('totalCount').innerText = count;

        lucide.createIcons();
      } catch (err) {
        showModal("Erro", "Falha ao buscar vendas: " + err.message);
      }
    }

    // Deletar Registro
    async function deleteTransaction(id) {
      if (confirm("Tem certeza que deseja apagar este registro de venda?")) {
        try {
          await db.collection("transactions").doc(id).delete();
          loadData();
        } catch (err) {
          showModal("Erro", "Erro ao apagar: " + err.message);
        }
      }
    }

    // Inicializar carregamento dos dados
    window.onload = loadData;
  </script>
</body>
</html>
